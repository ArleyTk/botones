<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="categoria1">
        <button type="button" class="btn btn-primary">Primario</button>
        <button type="button" class="btn btn-secondary">Secundario</button>
        <button type="button" class="btn btn-success">Éxito</button>
        <button type="button" class="btn btn-danger">Peligro</button>
        <button type="button" class="btn btn-warning">Advertencia</button>
        <button type="button" class="btn btn-info">Información</button>
        <button type="button" class="btn btn-dark">Oscuro</button>
        <button type="button" class="btn btn-light">Claro</button>
        <button type="button" class="btn btn-text">Texto</button>
        <button type="button" class="btn btn-custom">Personalizado</button>
    </section>
    <hr>
    <section class="categoria2">
        <button type="button" class="btn btn-outline">Contorno</button>
        <button type="button" class="btn btn-border-thick">Borde Grueso</button>
        <button type="button" class="btn btn-border-dashed">Borde Discontinuo</button>
        <button type="button" class="btn btn-border-dotted">Borde Punteado</button>
        <button type="button" class="btn btn-rounded">Esquinas redondeadas</button>
        <button type="button" class="btn btn-pill">Píldora</button>
        <button type="button" class="btn btn-circle">Circular</button>
        <button type="button" class="btn btn-small">Pequeño</button>
        <button type="button" class="btn btn-large">Grande</button>
        <button type="button" class="btn btn-full">Ancho completo</button>
    </section>
    <hr>
    <section class="categoria3">
        <button type="button" class="btn btn-primary btn-uppercase">Mayúsculas</button>
        <button type="button" class="btn btn-primary btn-spaced">Espaciado</button>
        <button type="button" class="btn btn-primary btn-bold">Negrita</button>
        <button type="button" class="btn btn-primary btn-elegant">Elegante</button>
        <button type="button" class="btn btn-primary btn-underline">Subrayado</button>
        <button type="button" class="btn btn-primary btn-shadow-soft">Sombra Suave</button>
        <button type="button" class="btn btn-primary btn-shadow-strong">Sombra Pronunciada</button>
        <button type="button" class="btn btn-primary btn-shadow-color">Sombra Color</button>
        <button type="button" class="btn btn-primary btn-relief">Relieve</button>
        <button type="button" class="btn btn-text-glow">Texto Brillante</button>
    </section>

</body>

</html>
